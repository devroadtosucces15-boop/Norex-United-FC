# BE0: Web Push (RFC 8292). Public half of the VAPID keypair – safe to commit, sent to browsers on purpose.
# The private half is VAPID_PRIVATE_KEY, a Worker secret uploaded from the GH Actions secret of the same name.
VAPID_PUBLIC_KEY = "BHlk5h_Pk73q6Puq3GZBlD2N11-0XNiDukORC4i62w98wxnFxWgoT1V145xhFihpafT1RTwJKFdyFwncyxKru_s"

# P11.1: Workers AI (free 10,000 neurons/day on this account) – image + text models for Phase 11
[ai]
binding = "AI"

# P6.3b live chat: one Durable Object per chat room (SQLite-backed class = Workers Free plan)
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# BE8 Hub: one shared Durable Object for the whole club's live "who's here" roster + waves
[[durable_objects.bindings]]
name = "HUB_ROOM"
class_name = "HubRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# Redesign BE0 live rooms: generic ClubRoom DO for Locker/Dugout/Studio broadcast (bot/clubroom.js)
[[durable_objects.bindings]]
name = "CLUB_ROOM"
class_name = "ClubRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HubRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ClubRoom"]
