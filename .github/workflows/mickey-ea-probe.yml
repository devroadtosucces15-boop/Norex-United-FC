name: Mickey EA probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mickey-ball-bot/relay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mickey-ball-bot/relay/probe.mjs
