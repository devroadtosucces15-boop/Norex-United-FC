name: Mickey relay

# EA blocks Cloudflare, but lets Actions through. The Worker dispatches this job with only a club name/ID; the job asks EA and posts the
# raw answer back to the Worker, which edits the waiting Discord reply. On a schedule it also feeds tracked clubs' new matches.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "waiting request id", required: false }
      kind: { description: "search | stats | track | poll", required: false, default: poll }
      q: { description: "club name or id", required: false }
      game: { description: "which match (1 = latest)", required: false, default: "1" }
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: mickey-relay-${{ github.event_name }}-${{ inputs.ref || 'poll' }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: mickey-ball-bot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask EA and answer the bot
        env:
          RELAY_REF: ${{ inputs.ref }}
          RELAY_KIND: ${{ inputs.kind || 'poll' }}
          RELAY_Q: ${{ inputs.q }}
          RELAY_GAME: ${{ inputs.game || '1' }}
          MICKEY_WORKER_URL: ${{ secrets.MICKEY_WORKER_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node mickey-ball-bot/relay/relay.mjs
