name: Sync issue reports

# Copies the owner's bug reports and recordings from the bot's D1 database / R2 bucket into ISSUES/ (text + a few frames per video), so Claude
# sessions can read them. Uses the same Cloudflare secrets as the nightly backup – nothing new to add. See ISSUES/README.md.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issues-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/issues-sync.mjs
      - name: Keep the full videos for two weeks (not in git)
        if: hashFiles('ISSUES/.videos/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: issue-videos
          path: ISSUES/.videos
          retention-days: 14
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ISSUES
          git diff --cached --quiet || { git commit -m "issues: sync reports"; git pull --rebase origin "$GITHUB_REF_NAME" && git push; }
