name: Deploy Discord bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/**", "config.json"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check setup
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Cloudflare secrets not added yet – see README → Discord bot. Skipping."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22

      - name: Member database (Cloudflare KV + D1)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node bot/ensure-resources.mjs

      - name: Apply database migrations (D1)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: bot
        run: npx --yes wrangler@4 d1 migrations apply norex --remote

      - name: Feature flags (config.json → Worker var FEATURES)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node -e 'const f = JSON.stringify(require("./config.json").features || {}); require("fs").appendFileSync("bot/wrangler.toml", `FEATURES = ${JSON.stringify(f)}\n`); console.log("FEATURES", f)'

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: bot
        run: npx --yes wrangler@4 deploy

      - name: Upload secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: bot
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          node -e '
            const s = {};
            for (const k of ["GH_DISPATCH_TOKEN", "DISCORD_CLIENT_SECRET"]) if (process.env[k]) s[k] = process.env[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(s));
            console.log("Uploading:", Object.keys(s).join(", ") || "none");
          '
          npx --yes wrangler@4 secret bulk secrets.json
          rm secrets.json

      - name: Register slash commands
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node bot/register.mjs
        env:
          DISCORD_APP_ID: "1553967740543569970"
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
