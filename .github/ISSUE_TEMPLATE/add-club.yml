name: Add a club
description: Play for another club too? Add it so your stats there show up on the site.
title: "Add club: "
labels: ["add-club"]
body:
  - type: input
    id: club
    attributes:
      label: Club name
      description: Exactly as it appears in the game (capital letters don't matter).
      placeholder: My Other FC
    validations:
      required: true
  - type: input
    id: gamertag
    attributes:
      label: Your gamertag (optional)
