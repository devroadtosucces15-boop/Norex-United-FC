name: Sync GitHub stars

# Writes the owner's starred repos and star lists to RESEARCH/stars/ (one markdown file per list).
# Needs a read-only token in the STARS_TOKEN repo secret – see RESEARCH/README.md. Without it the job just skips.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STARS_TOKEN: ${{ secrets.STARS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stars-sync.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESEARCH/stars
          git diff --cached --quiet || { git commit -m "research: sync stars"; git pull --rebase origin "$GITHUB_REF_NAME" && git push; }
